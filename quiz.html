<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Quiz — AIF-C01</title>
  <link rel="stylesheet" href="css/site.css" />
</head>
<body data-page="quiz">
  <div class="main">
    <h1 id="exam-title">Quiz</h1>
    <p class="lead" id="intro">Untimed practice. After you answer, the next question opens. Explanations appear after you submit.</p>
    <div id="runner">
      <div id="timer-wrap" style="display:none"><span id="timer" class="timer"></span></div>
      <div class="palette" id="palette"></div>
      <div id="qbox"></div>
      <div class="btn-row">
        <button class="btn ghost" id="prev-btn">Previous</button>
        <button class="btn ghost" id="flag-btn">Flag for review</button>
        <button class="btn" id="next-btn">Next</button>
      </div>
    </div>
    <div id="results-panel" style="display:none">
      <div class="ok">
        <h3 id="res-head"></h3>
        <p id="res-sub"></p>
      </div>
      <table id="res-table"></table>
      <h2>Review</h2>
      <div id="review"></div>
      <p class="btn-row">
        <a class="btn" href="quiz.html" id="retry">Retry</a>
        <a class="btn dark" href="index.html">Home</a>
      </p>
    </div>
  </div>
  <div class="overlay" id="submit-modal">
    <div class="modal">
      <h2>Submit quiz?</h2>
      <p id="submit-msg"></p>
      <div class="btn-row">
        <button class="btn" id="confirm-submit">Submit</button>
        <button class="btn ghost" id="cancel-submit">Keep working</button>
      </div>
    </div>
  </div>
  <script src="js/progress.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/banks/quizzes.js"></script>
  <script>
    var set = new URLSearchParams(location.search).get("set") || "mixed";
    var meta = {
      d1: "Domain 1 quiz",
      d2: "Domain 2 quiz",
      d3: "Domain 3 quiz",
      d4: "Domain 4 quiz",
      d5: "Domain 5 quiz",
      svc: "Pick-the-service quiz",
      mixed: "Mixed rapid quiz"
    };
    document.getElementById("retry").href = "quiz.html?set=" + encodeURIComponent(set);
    var qs = (window.AIF.quizzes && AIF.quizzes[set]) || [];
    if (!qs.length) {
      document.getElementById("qbox").innerHTML = "<div class='warn'><p>Quiz bank missing for " + set + ".</p></div>";
    } else {
      AIF.runQuiz({ title: meta[set] || "Quiz", questions: qs, storeKey: set, timed: false });
    }
  </script>
</body>
</html>
